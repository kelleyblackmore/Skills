# .github/workflows/container.yml: lint, build, scan, then push and sign only if every gate passes.
# Versions and SHAs were the latest when written; re-pin with the commands in the ci-pipelines skill.
name: container

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  OS_DISTRO: "rhel:9"                         # must match the base image
  SSG_VERSION: "0.1.82"                       # latest ComplianceAsCode release
  SSG_DATASTREAM: ssg-rhel9-ds.xml
  SSG_PROFILE: xccdf_org.ssgproject.content_profile_stig_container

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint (hadolint)
        run: |
          docker run --rm -i -v "$PWD/.hadolint.yaml:/tmp/hadolint.yaml:ro" \
            docker.io/hadolint/hadolint:v2.15.1-debian@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27 \
            hadolint -c /tmp/hadolint.yaml - < Containerfile

      - name: Build
        env:
          SHA: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          podman build --pull=always \
            --label org.opencontainers.image.source="$SOURCE" \
            --label org.opencontainers.image.revision="$SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            -t "$IMAGE:$SHA" -f Containerfile .
          podman save --format oci-archive -o image.tar "$IMAGE:$SHA"

      - name: SBOM (syft)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            docker.io/anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a \
            oci-archive:image.tar -o cyclonedx-json=sbom.cdx.json

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install scanners
        run: |
          uv tool install hoppr-cop --with setuptools
          # grype and trivy CLIs, which hoppr-cop calls. Pin and verify release
          # checksums in real pipelines.
          curl -sSfL https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz | tar xz -C "$HOME/.local/bin" grype
          curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz | tar xz -C "$HOME/.local/bin" trivy

      - name: Vulnerabilities (hoppr-cop + gate)
        run: |
          hoppr-cop -s grype -s trivy --os-distro "$OS_DISTRO" --assessment . \
            -f table -f html -f cyclone_dx -b app -d reports sbom.cdx.json
          python3 scripts/hopprcop_gate.py reports/app-enhanced.json --fail-on high

      - name: Compliance (OpenSCAP)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q openscap-scanner openscap-utils
          curl -sSfL -o ssg.zip "https://github.com/ComplianceAsCode/content/releases/download/v${SSG_VERSION}/scap-security-guide-${SSG_VERSION}.zip"
          unzip -j -o ssg.zip "*/${SSG_DATASTREAM}"
          # oscap-podman runs as root, so give root's podman storage the image.
          sudo podman load -i image.tar
          sudo oscap-podman "$IMAGE:$GITHUB_SHA" xccdf eval \
            --profile "$SSG_PROFILE" --tailoring-file container-tailoring.xml \
            --results-arf reports/oscap-arf.xml --report reports/oscap-report.html \
            "$SSG_DATASTREAM"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scan-reports
          path: |
            sbom.cdx.json
            reports/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  publish:
    needs: build-and-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scan-reports
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Push, sign, attest SBOM
        env:
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
          podman load -i image.tar
          podman push --digestfile digest "$IMAGE:$SHA"
          DIGEST=$(cat digest)
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$DIGEST"
