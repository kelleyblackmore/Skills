default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents] # Kubernetes manifests use --- separators
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        types: [python]
      - id: ruff-format
        types: [python]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit

  - repo: local
    hooks:
      - id: validate-skills
        name: validate skill frontmatter
        entry: python3 scripts/validate_skills.py
        language: system
        pass_filenames: false
        files: ^skills/
      - id: commit-msg-policy
        name: commit message policy
        entry: skills/git-workflow/scripts/check-commit-msg.sh
        language: script
        stages: [commit-msg]
