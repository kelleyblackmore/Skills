name: release-extension

on:
  push:
    tags: ["vscode-v*"]

permissions:
  contents: read

concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release and attach the .vsix
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in a release build: a poisoned cache would ship in the .vsix.
          package-manager-cache: false
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "vscode-v$version" ]; then
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run package
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" agent-skills.vsix --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
